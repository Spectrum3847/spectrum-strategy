<!DOCTYPE html>
<html>
<head>

  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Spectrum Strategy: FRC strategy, scouting, and prematch analysis.">

  <meta name="mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Spectrum Strategy">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Spectrum Strategy</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Literals because nothing here can read StrategyPalette: this file is
       parsed before any Dart runs. Each names the token it mirrors. */
    :root {
      --boot-canvas: #F2ECF7; /* StrategyPalette.background */
      --boot-accent: #3C0060; /* StrategyPalette.primary */
      --boot-on-accent: #FFFFFF; /* the light theme's onPrimary */
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --boot-canvas: #141117; /* StrategyPalette.darkBackground */
        --boot-accent: #CFBCFF; /* StrategyPalette.darkPrimary */
        --boot-on-accent: #141117; /* StrategyPalette.darkBackground */
      }
    }
    html, body {
      margin: 0;
      background: var(--boot-canvas);
    }
    #boot {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      overflow: hidden;
      z-index: 1;
      /* Nothing here should ever take a tap. If the removal below failed for
         any reason, a bar left over the top 2px must not swallow a press on
         whatever the app puts there. */
      pointer-events: none;
    }
    #boot::after {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: 40%;
      background: var(--boot-accent);
      animation: boot-sweep 1.4s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    /* Transform only, so this never triggers layout. */
    @keyframes boot-sweep {
      from { transform: translateX(-100%); }
      to   { transform: translateX(250%); }
    }
    /* A still bar rather than no feedback at all. */
    @media (prefers-reduced-motion: reduce) {
      #boot::after {
        width: 100%;
        animation: none;
        opacity: 0.4;
      }
    }
    /*
      Shown only when a new build arrived and reloading might discard work, so
      it has to sit above Flutter's own view rather than inside it.
    */
    #update-bar[hidden], #offline-note[hidden] { display: none; }
    #offline-note {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
      background: var(--boot-canvas);
      color: var(--boot-accent);
      font: 500 15px/1.5 system-ui, sans-serif;
      text-align: center;
    }
    #update-bar {
      position: fixed;
      inset: auto 0 0 0;
      z-index: 2;
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      padding: 12px 16px;
      background: var(--boot-accent);
      color: var(--boot-on-accent);
      font: 500 14px/1.3 system-ui, sans-serif;
    }
    #update-bar button {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid currentColor;
      border-radius: 4px; /* StrategyPalette.radiusSm */
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    #update-bar button.primary {
      background: var(--boot-on-accent);
      color: var(--boot-accent);
      border-color: transparent;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="boot" role="progressbar" aria-label="Loading Spectrum Strategy"
       aria-busy="true"></div>

  <div id="offline-note" role="status" hidden>
    <span>Spectrum Strategy cannot start offline yet. Open it once with a
      connection, then it will work without one.</span>
  </div>
  <div id="update-bar" role="status" hidden>
    <span>A newer version of Spectrum Strategy is ready.</span>
    <button type="button" class="primary"
            onclick="window.location.reload()">Reload now</button>
    <button type="button"
            onclick="this.parentNode.hidden = true">Later</button>
  </div>

  <script>
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      var timer = setTimeout(giveUp, 30000);
      window.addEventListener('flutter-first-frame', remove, { once: true });
      function remove() {
        clearTimeout(timer);
        if (boot.parentNode) boot.remove();
      }
      // Reaching the timeout means the app never painted. Offline, that means
      // this device has not cached enough of the build to run, and a blank
      // coloured screen does not say so. Online it is a real failure and the
      // console has the detail.
      function giveUp() {
        remove();
        if (navigator.onLine) return;
        var note = document.getElementById('offline-note');
        if (note) note.hidden = false;
      }
    })();
  </script>

  <script>
    (function() {
      function prime(name, store, options, retried) {
        try {
          var req = indexedDB.open(name, 1);
          req.onupgradeneeded = function() {
            if (!req.result.objectStoreNames.contains(store)) {
              req.result.createObjectStore(store, options);
            }
          };
          req.onsuccess = function() {
            var healthy = req.result.objectStoreNames.contains(store);
            req.result.close();
            if (!healthy && !retried) {
              var del = indexedDB.deleteDatabase(name);
              del.onsuccess = function() { prime(name, store, options, true); };
            }
          };
        } catch (e) {}
      }
      prime('firebaseLocalStorageDb', 'firebaseLocalStorage',
          { keyPath: 'fbase_key' }, false);
      prime('firebase-heartbeat-database', 'firebase-heartbeat-store',
          undefined, false);
      // This misnamed, empty database is a leftover; the SDK never opens it.
      try { indexedDB.deleteDatabase('firebase-heartbeat-storage'); } catch (e) {}
    })();
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (registration) {
          // A browser only rechecks sw.js on navigation or, for a tab that
          // stays open, roughly once every 24 hours. A strategy lead's tab
          // stays open for a whole event, so without this a deploy mid-event
          // sat uncaught until someone closed and reopened it: the cache
          // this worker writes was correct, but nothing asked whether a new
          // one existed. `sw.js` is served Cache-Control: no-cache
          // (firebase.json), so `update()` always reaches the network rather
          // than a cached copy of itself.
          window.setInterval(function () {
            registration.update().catch(function () {});
          }, 5 * 60 * 1000);
          // Cheaper than the poll and catches the common case sooner: a
          // laptop woken from sleep or a phone brought back to the
          // foreground after the app was backgrounded through a scout entry.
          document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'visible') {
              registration.update().catch(function () {});
            }
          });
        }).catch(function (error) {
          console.warn('Service worker registration failed:', error);
        });
      });

      // Whether the person has done anything in this page yet. A reload throws
      // away whatever a form is holding, and nothing here can see into
      // Flutter's widget state to know if that matters, so this stands in for
      // it: before the first tap or keypress there is nothing of theirs to
      // lose.
      var touched = false;
      ['pointerdown', 'keydown'].forEach(function (type) {
        window.addEventListener(type, function () { touched = true; }, {
          once: true,
          capture: true,
          passive: true,
        });
      });

      // Tell the worker what this page actually loaded, so one online visit is
      // enough to work offline. The worker cannot see the engine or the
      // renderer being fetched on a first visit, because they are in flight
      // before it activates, and it cannot guess which of them a given
      // browser needs: Chromium takes the wasm build, iOS has no WasmGC and
      // takes main.dart.js plus canvaskit instead.
      function reportLoadedResources() {
        if (!window.performance) return;
        var prefix = window.location.origin + '/';
        var urls = window.performance
          .getEntriesByType('resource')
          .map(function (entry) { return entry.name; })
          .filter(function (name) { return name.indexOf(prefix) === 0; });
        if (!urls.length) return;
        // Through `ready` and `active`, not `controller`. On a first visit the
        // worker has not claimed the page yet, so `controller` is null, and
        // how long that lasts is up to the browser. Depending on it meant a
        // browser slower to claim than Chromium reported nothing at all, and
        // then nothing past the shell was ever cached: the bug this whole
        // path exists to fix, reintroduced by the way it was wired.
        navigator.serviceWorker.ready
          .then(function (registration) {
            var worker = registration.active || navigator.serviceWorker.controller;
            if (worker) {
              worker.postMessage({ type: 'spectrum-cache-these', urls: urls });
            }
          })
          .catch(function (error) {
            console.warn('Could not report resources to cache:', error);
          });
      }

      // Once when there is something on screen, and again later for the fonts
      // and configs the app loads after its first frame. Both are idempotent;
      // the worker skips anything already cached.
      window.addEventListener('flutter-first-frame', function () {
        reportLoadedResources();
        window.setTimeout(reportLoadedResources, 8000);
      }, { once: true });

      // A first visit gains a controller partway through loading, which is
      // after the engine has already been fetched. Reporting again here is
      // what catches that case.
      navigator.serviceWorker.addEventListener(
        'controllerchange',
        reportLoadedResources
      );

      navigator.serviceWorker.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.type !== 'spectrum-update-ready') return;
        // The worker has already claimed this page and its cache is the new
        // build's, so the running bundle is the stale one from here on. A
        // reload is the whole fix; there is nothing to ask the worker for.
        if (touched) {
          showUpdateBar();
        } else if (claimAutoReload(String(data.build || ''))) {
          window.location.reload();
        }
      });

      // Guards a reload loop. Storing the build id, not a flag, so a later
      // deploy in the same session still reloads once. sessionStorage throws
      // in some privacy modes, and there the bar is the safe fallback.
      function claimAutoReload(build) {
        try {
          var key = 'spectrum-auto-reloaded';
          if (window.sessionStorage.getItem(key) === build) return false;
          window.sessionStorage.setItem(key, build);
          return true;
        } catch (error) {
          showUpdateBar();
          return false;
        }
      }

      function showUpdateBar() {
        var bar = document.getElementById('update-bar');
        if (!bar || !bar.hidden) return;
        bar.hidden = false;
      }
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
