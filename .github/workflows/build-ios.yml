name: Build iOS (reusable)

on:
  workflow_call:
    inputs:
      repository:
        description: "Repo to check out (the mirror itself for nightly, the private repo for a release tag)"
        type: string
        required: true
      ref:
        description: "Git ref or sha to build"
        type: string
        required: true
      needs_source_token:
        description: "true when repository is the private repo and needs MIRROR_SOURCE_TOKEN to check out"
        type: boolean
        default: false
      restore_docs_artifact:
        description: "true when building from a mirror snapshot that stripped docs/ and needs the private-docs artifact restored"
        type: boolean
        default: false
      version_name:
        description: "Requested --build-name (Xcode may strip a non-numeric suffix; the real value comes back as the version output)"
        type: string
        required: true
      build_number:
        description: "--build-number value; must increase for AltStore to offer the build as an update"
        type: string
        required: true
      git_commit:
        description: "Value for the GIT_COMMIT dart-define"
        type: string
        required: true
      git_branch:
        description: "Value for the GIT_BRANCH dart-define"
        type: string
        required: true
      ipa_filename:
        description: "Fixed output filename (nightly). Empty derives SpectrumStrategy-<real version>.ipa (release)."
        type: string
        default: ""
    outputs:
      version:
        description: "CFBundleShortVersionString actually baked into the built IPA"
        value: ${{ jobs.build.outputs.version }}
      build:
        description: "CFBundleVersion actually baked into the built IPA"
        value: ${{ jobs.build.outputs.build }}
      ipa_filename:
        description: "The filename the IPA was packaged under, inside the ios-build artifact"
        value: ${{ jobs.build.outputs.ipa_filename }}

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.info.outputs.version }}
      build: ${{ steps.info.outputs.build }}
      ipa_filename: ${{ steps.name.outputs.ipa_filename }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
          token: ${{ inputs.needs_source_token && secrets.MIRROR_SOURCE_TOKEN || github.token }}
          persist-credentials: false

      - name: Restore private docs bundle
        if: inputs.restore_docs_artifact
        uses: actions/download-artifact@v8
        with:
          name: private-docs
      - name: Extract private docs bundle
        if: inputs.restore_docs_artifact
        run: tar -xzf private-docs.tar.gz && rm private-docs.tar.gz

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Build unsigned IPA
        run: |
          flutter build ios --release --no-codesign \
            --obfuscate --split-debug-info=build/symbols \
            --build-name "${{ inputs.version_name }}" \
            --build-number "${{ inputs.build_number }}" \
            --dart-define=GIT_COMMIT="${{ inputs.git_commit }}" \
            --dart-define=GIT_BRANCH="${{ inputs.git_branch }}" \
            --dart-define=SPECTRUM_APP_KEY=spectrumstrategy \
            --dart-define=POSTHOG_API_KEY=${{ secrets.POSTHOG_API_KEY }}

      - name: Upload iOS obfuscation symbols
        uses: actions/upload-artifact@v7
        with:
          name: ios-obfuscation-symbols
          path: build/symbols
          retention-days: 90
          if-no-files-found: warn

      - name: Read real version from built Info.plist
        id: info
        run: |
          APP_PATH="$(find build/ios -type d -name Runner.app | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "Runner.app not found under build/ios"; exit 1
          fi
          REAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          REAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP_PATH/Info.plist")"
          if [ -z "$REAL_VERSION" ] || [ -z "$REAL_BUILD" ]; then
            echo "Could not read CFBundle values from $APP_PATH/Info.plist"; exit 1
          fi
          {
            echo "app_path=$APP_PATH"
            echo "version=$REAL_VERSION"
            echo "build=$REAL_BUILD"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve IPA filename
        id: name
        env:
          FIXED_NAME: ${{ inputs.ipa_filename }}
          REAL_VERSION: ${{ steps.info.outputs.version }}
        run: |
          if [ -n "$FIXED_NAME" ]; then
            echo "ipa_filename=$FIXED_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "ipa_filename=SpectrumStrategy-$REAL_VERSION.ipa" >> "$GITHUB_OUTPUT"
          fi

      - name: Package IPA
        env:
          APP_PATH: ${{ steps.info.outputs.app_path }}
          IPA_FILE: ${{ steps.name.outputs.ipa_filename }}
        run: |
          mkdir -p altstore_out/Payload
          cp -R "$APP_PATH" altstore_out/Payload/
          (cd altstore_out && zip -qr "$IPA_FILE" Payload && rm -rf Payload)
          cp web/icons/Icon-192.png altstore_out/icon.png

      - name: Upload iOS build (IPA + icon)
        uses: actions/upload-artifact@v7
        with:
          name: ios-build
          path: altstore_out
          if-no-files-found: error
