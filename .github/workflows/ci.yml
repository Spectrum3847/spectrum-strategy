name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check what changed
        id: scope
        run: |
          if git diff --quiet HEAD^1 HEAD -- . ':!.github/workflows'; then
            echo "Only workflows changed; skipping the Flutter checks."
            echo "source=false" >> "$GITHUB_OUTPUT"
          else
            echo "source=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Flutter
        if: steps.scope.outputs.source == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          cache: true

      - name: Fetch packages
        if: steps.scope.outputs.source == 'true'
        run: flutter pub get

      - name: Verify formatting
        if: steps.scope.outputs.source == 'true'
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        if: steps.scope.outputs.source == 'true'
        run: flutter analyze --fatal-infos

      - name: Install native build headers
        if: steps.scope.outputs.source == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libgtk-3-dev libx11-dev libxi-dev pkg-config

      - name: Run tests
        if: steps.scope.outputs.source == 'true'
        run: flutter test

      - name: Check REUSE compliance
        uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5
