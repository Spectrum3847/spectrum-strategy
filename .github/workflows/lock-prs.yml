name: Lock pull requests

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  lock:
    if: github.repository == 'Spectrum3847/spectrum-strategy'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Lock the pull request conversation
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/lock"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
