[package]
name = "spectrum-relay"
version = "0.1.0"
edition = "2024"
description = "Answers Spectrum Strategy AI summaries and private chat with a local llama.cpp model"
publish = false

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
ctrlc = { version = "3", features = ["termination"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tiny_http = "0.12"
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rtc ={ version = "0.21", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
webpki-roots = "1"
webrtc ={ version = "0.21", default-features = false, features = ["runtime-tokio", "crypto-ring"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
